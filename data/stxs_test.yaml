treename: Events

# Holds off events for testing, to be used for final evaluation of the model
selection:
   event_mod5 == 4

test_time_selection:
   event_mod5 != 4

new_variables:
   # generator pT_H bins [0,120), [120,200), [200,inf) GeV
   is_ptbin0: GenHiggs_ptBin == 0
   is_ptbin1: GenHiggs_ptBin == 1
   is_ptbin2: GenHiggs_ptBin == 2

   event_int64: ak.values_astype(event, np.int64)

   
   era_is_2022: era_is_2022
   era_is_2022EE: era_is_2022EE
   era_is_2023: era_is_2023
   era_is_2023BPix: era_is_2023BPix
   era_is_2024: era_is_2024


   jet_mask: np.stack([Jet0_pt > 0, Jet1_pt > 0, Jet2_pt > 0, Jet3_pt > 0, Jet4_pt > 0, Jet5_pt > 0, Jet6_pt > 0, Jet7_pt > 0], axis=1) * 1.
   jet_pt: np.where(jet_mask > 0, np.stack([Jet0_pt, Jet1_pt, Jet2_pt, Jet3_pt, Jet4_pt, Jet5_pt, Jet6_pt, Jet7_pt], axis=1), 0.)
   jet_eta: np.where(jet_mask > 0, np.stack([Jet0_eta, Jet1_eta, Jet2_eta, Jet3_eta, Jet4_eta, Jet5_eta, Jet6_eta, Jet7_eta], axis=1), 0.)
   jet_phi: np.where(jet_mask > 0, np.stack([Jet0_phi, Jet1_phi, Jet2_phi, Jet3_phi, Jet4_phi, Jet5_phi, Jet6_phi, Jet7_phi], axis=1), 0.)
   jet_mass: np.where(jet_mask > 0, np.stack([Jet0_mass, Jet1_mass, Jet2_mass, Jet3_mass, Jet4_mass, Jet5_mass, Jet6_mass, Jet7_mass], axis=1), 0.)
   jet_no_btag: np.where(jet_mask > 0, np.stack([Jet0_noBTag, Jet1_noBTag, Jet2_noBTag, Jet3_noBTag, Jet4_noBTag, Jet5_noBTag, Jet6_noBTag, Jet7_noBTag], axis=1), 0.)
   jet_loose_btag: np.where(jet_mask > 0, np.stack([Jet0_isLooseBTag, Jet1_isLooseBTag, Jet2_isLooseBTag, Jet3_isLooseBTag, Jet4_isLooseBTag, Jet5_isLooseBTag, Jet6_isLooseBTag, Jet7_isLooseBTag], axis=1), 0.)
   jet_medium_btag: np.where(jet_mask > 0, np.stack([Jet0_isMediumBTag, Jet1_isMediumBTag, Jet2_isMediumBTag, Jet3_isMediumBTag, Jet4_isMediumBTag, Jet5_isMediumBTag, Jet6_isMediumBTag, Jet7_isMediumBTag], axis=1), 0.)
   jet_tight_btag: np.where(jet_mask > 0, np.stack([Jet0_isTightBTag, Jet1_isTightBTag, Jet2_isTightBTag, Jet3_isTightBTag, Jet4_isTightBTag, Jet5_isTightBTag, Jet6_isTightBTag, Jet7_isTightBTag], axis=1), 0.)
   #jet_xxtight_btag: np.where(jet_mask > 0, np.stack([Jet0_isXXTightBTag, Jet1_isXXTightBTag, Jet2_isXXTightBTag, Jet3_isXXTightBTag, Jet4_isXXTightBTag, Jet5_isXXTightBTag, Jet6_isXXTightBTag, Jet7_isXXTightBTag], axis=1), 0.)
   jet_p4: _p4_from_ptetaphim(jet_pt, jet_eta, jet_phi, jet_mass)
   jet_px: jet_p4.px
   jet_py: jet_p4.py
   jet_pz: jet_p4.pz
   jet_energy: jet_p4.energy
   jet_logpt: np.where(jet_mask > 0, np.log(np.maximum(jet_pt, 1.0e-6)), 0.)
   jet_logenergy: np.where(jet_mask > 0, np.log(np.maximum(jet_energy, 1.0e-6)), 0.)

   # Defining missing transverse energy (MET) as a "fake lepton"
   met: np.sqrt(MET_x**2 + MET_y**2)
   met_phi: np.arctan2(MET_y, MET_x)

   lep_pt: np.stack([LepFO1_conePt, LepFO2_conePt, met], axis=1)
   lep_eta: np.stack([LepFO1_eta, LepFO2_eta, met * 0.], axis=1)
   lep_phi: np.stack([LepFO1_phi, LepFO2_phi, met_phi], axis=1)
   lep_mass: np.stack([LepFO1_mass, LepFO2_mass, met * 0.], axis=1)
   lep_mask: np.stack([met * 0. + 1., met * 0. + 1., met * 0. + 1.], axis=1)
   lep_pdgid: np.stack([LepFO1_pdgId, LepFO2_pdgId, met * 0.], axis=1)
   lep_is_met: np.stack([met * 0., met * 0., met * 0. + 1.], axis=1)
   lep_p4: _p4_from_ptetaphim(lep_pt, lep_eta, lep_phi, lep_mass)
   lep_px: lep_p4.px
   lep_py: lep_p4.py
   lep_pz: lep_p4.pz
   lep_energy: lep_p4.energy
   lep_logpt: np.log(np.maximum(lep_pt, 1.0e-6))
   lep_logenergy: np.log(np.maximum(lep_energy, 1.0e-6))
   lep_pdgid_scaled: lep_pdgid / 13.

preprocess:
   method: manual
   data_fraction: 0.25

inputs:
   jet_features:
      length: 8
      pad_mode: constant
      vars:
         - [jet_logpt, 4, 1]
         - [jet_logenergy, 4, 1]
         - [jet_eta, null]
         - [jet_no_btag, null]
         - [jet_loose_btag, null]
         - [jet_medium_btag, null]
         - [jet_tight_btag, null]
         #- [jet_xxtight_btag, null]
   jet_vectors:
      length: 8
      pad_mode: constant
      vars:
         - [jet_px, null]
         - [jet_py, null]
         - [jet_pz, null]
         - [jet_energy, null]
   jet_mask:
      length: 8
      pad_mode: constant
      vars:
         - [jet_mask, null]
   lep_features:
      length: 3
      pad_mode: constant
      vars:
         - [lep_logpt, 4, 1]
         - [lep_logenergy, 4, 1]
         - [lep_eta, null]
         - [lep_pdgid_scaled, null]
         - [lep_is_met, null]
   lep_vectors:
      length: 3
      pad_mode: constant
      vars:
         - [lep_px, null]
         - [lep_py, null]
         - [lep_pz, null]
         - [lep_energy, null]
   lep_mask:
      length: 3
      pad_mode: constant
      vars:
         - [lep_mask, null]
labels:
   type: simple

   # generator-level Higgs pT and pT bin added
   value: [is_ptbin0, is_ptbin1, is_ptbin2]

observers:
   - run
   - luminosityBlock
   - event_int64
   - event_mod2
   - event_mod5
   - weight
   - genWeight
   - era_is_2022
   - era_is_2022EE
   - era_is_2023
   - era_is_2023BPix
   - era_is_2024

   # generator-level Higgs pT and pT bin added
   - GenHiggs_pt
   - GenHiggs_ptBin