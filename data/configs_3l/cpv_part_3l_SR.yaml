# Giorgio_ntuples/SR_3l 2022--2023BPix: use three light leptons, MET,
# and the first six central jets. Other inputs match the SR_2lss baseline.
# Training requires cp_even/cp_odd path aliases; DATA_VARIANT=SR_3l
# in the launchers supplies both. Each alias uses the
# corresponding SM or CP-odd weight from the same source event.
treename: CPSkim_3l0tau

file_magic:
   cp_label:
      '/cp_even/': 0
      '/cp_odd/': 1
   eraFlag:
      '__2022[.]root$': 0
      '__2022EE[.]root$': 1
      '__2023[.]root$': 2
      '__2023BPix[.]root$': 3

# Keep one event_mod5 fold as a default holdout, similar in spirit to the
# previous trainings. Override with --extra-selection-* or make a copy of this
# config if you want a different split.
selection:
   event_mod5 != 4

test_time_selection:
   event_mod5 == 4

new_variables:
   is_cp_even: cp_label == 0
   is_cp_odd: cp_label == 1
   event_int64: ak.values_astype(event, np.int64)
   # The event branch is uint64; evaluation observers need collatable int64 values.
   event_mod2: ak.values_astype(event % 2, np.int64)
   event_mod5: ak.values_astype(event % 5, np.int64)
   target_is_cpodd: cp_label
   process_id: cp_label
   loss_weight: np.abs(weight * np.where(cp_label == 0, weight_SM, weight_CP_odd))
   era_is_2022: (eraFlag == 0) * 1.
   era_is_2022EE: (eraFlag == 1) * 1.
   era_is_2023: (eraFlag == 2) * 1.
   era_is_2023BPix: (eraFlag == 3) * 1.
   era_is_2024: (eraFlag == 4) * 1.
   # costheta_ttbar uses -99 when undefined; keep only physical cosine values.
   costheta_ttbar_clean: np.where(np.isfinite(costheta_ttbar) & (np.abs(costheta_ttbar) <= 1.), costheta_ttbar, 0.)

   # The first nCentralJets slots are central; the tree's Jet*_mask flags are always true.
   jet_mask: np.arange(6)[None, :] < np.expand_dims(nCentralJets, 1)
   jet_pt: np.where(jet_mask, np.stack([Jet0_pt, Jet1_pt, Jet2_pt, Jet3_pt, Jet4_pt, Jet5_pt], axis=1), 0.)
   jet_eta: np.where(jet_mask, np.stack([Jet0_eta, Jet1_eta, Jet2_eta, Jet3_eta, Jet4_eta, Jet5_eta], axis=1), 0.)
   jet_phi: np.where(jet_mask, np.stack([Jet0_phi, Jet1_phi, Jet2_phi, Jet3_phi, Jet4_phi, Jet5_phi], axis=1), 0.)
   jet_mass: np.where(jet_mask, np.stack([Jet0_mass, Jet1_mass, Jet2_mass, Jet3_mass, Jet4_mass, Jet5_mass], axis=1), 0.)
   jet_btag_score: np.where(jet_mask, np.stack([Jet0_BTagDeepFlavB, Jet1_BTagDeepFlavB, Jet2_BTagDeepFlavB, Jet3_BTagDeepFlavB, Jet4_BTagDeepFlavB, Jet5_BTagDeepFlavB], axis=1), 0.)
   # XXTight is disabled here; the skim's tight flag remains inclusive.
   #xxtight_cut: np.where(eraFlag == 0, 0.9512, np.where(eraFlag == 1, 0.9542, np.where(eraFlag == 2, 0.9459, 0.9483)))[:, None]
   jet_from_hadtop: np.where(jet_mask, np.stack([Jet0_isFromHadTop, Jet1_isFromHadTop, Jet2_isFromHadTop, Jet3_isFromHadTop, Jet4_isFromHadTop, Jet5_isFromHadTop], axis=1), 0.)
   jet_no_btag: np.where(jet_mask, np.stack([Jet0_no_btag, Jet1_no_btag, Jet2_no_btag, Jet3_no_btag, Jet4_no_btag, Jet5_no_btag], axis=1), 0.)
   jet_loose_btag: np.where(jet_mask, np.stack([Jet0_loose_btag, Jet1_loose_btag, Jet2_loose_btag, Jet3_loose_btag, Jet4_loose_btag, Jet5_loose_btag], axis=1), 0.)
   jet_medium_btag: np.where(jet_mask, np.stack([Jet0_medium_btag, Jet1_medium_btag, Jet2_medium_btag, Jet3_medium_btag, Jet4_medium_btag, Jet5_medium_btag], axis=1), 0.)
   jet_tight_btag: np.where(jet_mask, np.stack([Jet0_tight_btag, Jet1_tight_btag, Jet2_tight_btag, Jet3_tight_btag, Jet4_tight_btag, Jet5_tight_btag], axis=1), 0.)
   #jet_xxtight_btag: (jet_btag_score >= xxtight_cut) * jet_mask
   jet_p4: _p4_from_ptetaphim(jet_pt, jet_eta, jet_phi, jet_mass)
   jet_px: jet_p4.px
   jet_py: jet_p4.py
   jet_pz: jet_p4.pz
   jet_energy: jet_p4.energy
   jet_logpt: np.log(np.maximum(jet_pt, 1.0e-6))
   jet_logenergy: np.log(np.maximum(jet_energy, 1.0e-6))

   lep_pt: np.stack([lepton0_conept, lepton1_conept, lepton2_conept, met_pt], axis=1)
   lep_eta: np.stack([lepton0_eta, lepton1_eta, lepton2_eta, met_pt * 0.], axis=1)
   lep_phi: np.stack([lepton0_phi, lepton1_phi, lepton2_phi, met_phi], axis=1)
   lep_mass: np.stack([lepton0_mass, lepton1_mass, lepton2_mass, met_pt * 0.], axis=1)
   lep_mask: np.stack([lepton0_mask, lepton1_mask, lepton2_mask, met_pt * 0. + 1.], axis=1)
   lep_pdgid: np.stack([lepton0_pdgId, lepton1_pdgId, lepton2_pdgId, met_pt * 0.], axis=1)
   lep_is_met: np.stack([met_pt * 0., met_pt * 0., met_pt * 0., met_pt * 0. + 1.], axis=1)
   lep_p4: _p4_from_ptetaphim(lep_pt, lep_eta, lep_phi, lep_mass)
   lep_px: lep_p4.px
   lep_py: lep_p4.py
   lep_pz: lep_p4.pz
   lep_energy: lep_p4.energy
   lep_logpt: np.log(np.maximum(lep_pt, 1.0e-6))
   lep_logenergy: np.log(np.maximum(lep_energy, 1.0e-6))
   lep_pdgid_scaled: lep_pdgid / 13.

preprocess:
   method: manual
   data_fraction: 0.25

inputs:
   jet_features:
      length: 6
      pad_mode: constant
      vars:
         - [jet_logpt, 4, 1]
         - [jet_logenergy, 4, 1]
         - [jet_eta, null]
         - [jet_no_btag, null]
         - [jet_loose_btag, null]
         - [jet_medium_btag, null]
         - [jet_tight_btag, null]
         #- [jet_xxtight_btag, null]
         - [jet_from_hadtop, null]
   jet_vectors:
      length: 6
      pad_mode: constant
      vars:
         - [jet_px, null]
         - [jet_py, null]
         - [jet_pz, null]
         - [jet_energy, null]
   jet_mask:
      length: 6
      pad_mode: constant
      vars:
         - [jet_mask, null]
   lep_features:
      length: 4
      pad_mode: constant
      vars:
         - [lep_logpt, 4, 1]
         - [lep_logenergy, 4, 1]
         - [lep_eta, null]
         - [lep_pdgid_scaled, null]
         - [lep_is_met, null]
   lep_vectors:
      length: 4
      pad_mode: constant
      vars:
         - [lep_px, null]
         - [lep_py, null]
         - [lep_pz, null]
         - [lep_energy, null]
   lep_mask:
      length: 4
      pad_mode: constant
      vars:
         - [lep_mask, null]
   event_features:
      length: 1
      pad_mode: constant
      vars:
         - [dEtaL0L1_BBframe, auto, 1]
         - [dEtaB1B2_LLframe, auto, 1]
         - [dPhiL0L1_BBframe, auto, 1]
         - [dPhiB1B2_LLframe, auto, 1]
         - [dEtaBB, auto, 1]
         - [dEtaL0L2_BBframe, auto, 1]
         - [dEtaL1L2_BBframe, auto, 1]
         - [dPhiL0L2_BBframe, auto, 1]
         - [dPhiL1L2_BBframe, auto, 1]
         - [dRlep01, auto, 1]
         - [dRlep12, auto, 1]
         - [dRlep20, auto, 1]
         - [costheta_ttbar_clean, auto, 1]
         - [b1_ttH, auto, 1]
         - [b2_ttH, auto, 1]
         - [b3_ttH, auto, 1]
         - [b4_ttH, auto, 1]
         - [era_is_2022, null]
         - [era_is_2022EE, null]
         - [era_is_2023, null]
         - [era_is_2023BPix, null]
         - [era_is_2024, null]
   loss_weight:
      length: 1
      pad_mode: constant
      vars:
         - [loss_weight, null]

labels:
   type: simple
   value: [is_cp_even, is_cp_odd]

observers:
   - run
   - luminosityBlock
   - event_int64
   - event_mod2
   - event_mod5
   - eraFlag
   - cp_label
   - target_is_cpodd
   - process_id
   - weight
   - weight_SM
   - weight_CP_odd
   - met_pt
   - met_phi
   - dEtaL0L1_BBframe
   - dEtaB1B2_LLframe
   - dPhiL0L1_BBframe
   - dPhiB1B2_LLframe
   - dEtaBB
   - b1_ttH
   - b2_ttH
   - b3_ttH
   - b4_ttH
   - jet_logenergy
   - jet_energy
